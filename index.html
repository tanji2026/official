        const App = () => {

            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
            const [user, setUser] = useState(null);
            const [isAdmin, setIsAdmin] = useState(false);
            const [toastMessage, setToastMessage] = useState("");
            const [showAdminModal, setShowAdminModal] = useState(false);
            const [showLoginModal, setShowLoginModal] = useState(false);
            const [selectedNote, setSelectedNote] = useState(null);

            const t = uiText[lang];
            const toggleLang = () => setLang(l => l === 'zh' ? 'en' : 'zh');

            useEffect(() => {
                if (!window.firebaseEnv) return;
                const { auth, db, appId, onAuthStateChanged, doc, getDoc } = window.firebaseEnv;
                
                const unsubscribe = onAuthStateChanged(auth, async (u) => {
                    if (u) {
                        setUser(u);
                        try {
                            const docRef = doc(db, 'artifacts', appId, 'users', u.uid);
                            const docSnap = await getDoc(docRef);
                            if (docSnap.exists() && docSnap.data().role === 'admin') {
                                setIsAdmin(true);
                            } else {
                                setIsAdmin(false);
                            }
                        } catch (error) {
                            setIsAdmin(false);
                        }
                    } else {
                        setUser(null);
                        setIsAdmin(false);
                    }
                });
                return () => unsubscribe();
            }, []);

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(""), 5000);
            };

            const handleLoginConfirm = async (type, email, password) => {
                if (!window.firebaseEnv) {
                    throw new Error("Firebase not ready.");
                }
                const { auth, signInAnonymously, createUserWithEmailAndPassword, signInWithEmailAndPassword, updateProfile, setDoc, doc, db, appId } = window.firebaseEnv;
                
                try {
                    if (type === 'register') {
                        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                        await updateProfile(userCredential.user, {
                            displayName: email.split('@')[0],
                            photoURL: "images/tanjibaby.png"
                        });
                        await setDoc(doc(db, 'artifacts', appId, 'users', userCredential.user.uid), {
                            email: email,
                            role: 'user',
                            createdAt: new Date().toISOString()
                        });
                        showToast("Register Success!");
                    } else if (type === 'login') {
                        await signInWithEmailAndPassword(auth, email, password);
                        showToast("Login Success!");
                    } else if (type === 'anon') {
                        await signInAnonymously(auth);
                        showToast("Guest Login Success!");
                    }
                    setShowLoginModal(false);
                } catch (error) {
                    throw new Error("Error occurred.");
                }
            };

            const handleLogout = async () => {
                if (!window.firebaseEnv) return;
                try {
                    await window.firebaseEnv.signOut(window.firebaseEnv.auth);
                    showToast("Logged out.");
                } catch (error) {
                    console.error(error);
                }
            };

            return (
                <div className="flex flex-col min-h-screen">
                    <Toast message={toastMessage} onClose={() => setToastMessage("")} />
                    <AdminModal isOpen={showAdminModal} onClose={() => setShowAdminModal(false)} t={t} />
                    <LoginModal isOpen={showLoginModal} onClose={() => setShowLoginModal(false)} onConfirm={handleLoginConfirm} t={t} />
                    <NoteModal isOpen={!!selectedNote} onClose={() => setSelectedNote(null)} note={selectedNote} t={t} lang={lang} />
                    
                    <Navbar 
                        isMobileMenuOpen={isMobileMenuOpen} 
                        setIsMobileMenuOpen={setIsMobileMenuOpen}
                        user={user}
                        isAdmin={isAdmin}
                        onLogin={() => setShowLoginModal(true)}
                        onLogout={handleLogout}
                        onOpenAdmin={() => setShowAdminModal(true)}
                        lang={lang}
                        toggleLang={toggleLang}
                        t={t}

                        <HeroSection t={t} />
                        <EcosystemSection t={t} />
                        <AwardsSection t={t} lang={lang} />
                        <AcademySection onOpenNote={setSelectedNote} t={t} lang={lang} />
                        <ServicesSection showToast={showToast} t={t} />
                    </main>
                    <Footer t={t} />

            );
