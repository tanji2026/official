<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>碳吉 TanJi | 氣候科技與永續創新</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f8fafc; }
        
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-12px); }
            100% { transform: translateY(0px); }
        }
        .animate-float {
            animation: float 4s ease-in-out infinite;
        }
        
        @keyframes blob {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
        }
        .animate-blob {
            animation: blob 7s infinite;
        }
        .animation-delay-2000 { animation-delay: 2s; }
        .animation-delay-4000 { animation-delay: 4s; }
        
        .blend-multiply {
            mix-blend-mode: multiply;
        }
    </style>
</head>
<body class="text-slate-800 antialiased overflow-x-hidden">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const ArrowRight = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        );

        const PlayCircle = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg>

        );

            const videoRef = useRef(null);

                "歡迎來到碳吉宇宙！🚀"

                {
                    id: 'finance',
                    title: '企業綠色融資與碳管理',

                    img: 'images/tanjibaby7.png',
                    tag: 'B2B 企業方案',
                    color: 'from-blue-50 to-indigo-50',
                    textColor: 'text-indigo-700'
                },
                {
                    id: 'nbs',
                    title: '社區微氣候韌性決策',

                    img: 'images/tanjibaby6.png',
                    tag: 'B2G 社區治理',
                    color: 'from-emerald-50 to-teal-50',
                    textColor: 'text-emerald-700'
                },
                {
                    id: 'edu',
                    title: '互動教育與地方創生',
                    desc: '開發 CCUS 多人連線模擬器與三峽職人實境遊戲，將嚴肅的環境議題轉化為趣味的數位體驗。',

                    tag: 'B2C 教育創新',
                    color: 'from-amber-50 to-orange-50',
                    textColor: 'text-amber-700'
                }
            ];

            useEffect(() => {
                if (videoRef.current) {
                    videoRef.current.play().catch(e => console.log(e));
                }
                
                setTimeout(() => {
                    setShowBubble(true);
                    setTimeout(() => setShowBubble(false), 3500);
                }, 1000);
            }, []);

            const handleMascotClick = () => {
                if (videoRef.current) {
                    videoRef.current.currentTime = 0; 
                    videoRef.current.play();
                }
                
                const randomDialog = dialogs[Math.floor(Math.random() * dialogs.length)];

                setShowBubble(true);

                            <img src="images/tanjibaby.png" alt="TanJi Logo" className="w-10 h-10 object-contain blend-multiply" />

                        <div className="hidden md:flex items-center gap-8 font-bold text-sm text-emerald-900/70">

                                <div className="absolute top-[20%] right-[-5%] w-80 h-80 bg-teal-200/40 rounded-full mix-blend-multiply filter blur-3xl opacity-70 animate-blob animation-delay-2000"></div>

                                    <div className="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-white/60 backdrop-blur-md border border-emerald-200 text-emerald-800 text-xs font-bold mb-6 shadow-sm">
                                        <span className="relative flex h-2 w-2">
                                          <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                                          <span className="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                                        </span>

                                    </div>
                                    
                                    <h1 className="text-5xl md:text-6xl lg:text-7xl font-black text-slate-800 tracking-tight leading-[1.15] mb-6">
                                        用科技讓<br className="hidden lg:block"/>
                                        <span className="text-transparent bg-clip-text bg-gradient-to-r from-emerald-600 to-teal-400">永續觸手可及</span>
                                    </h1>
                                    
                                    <p className="text-lg text-slate-600 mb-10 max-w-lg leading-relaxed font-medium">
                                        專為企業、社區與教育機構打造的創新平台。涵蓋綠色金融、碳排管理、氣候韌性與數位互動，讓改變從今天開始。

                                        <a href="#solutions" className="w-full sm:w-auto px-8 py-4 bg-emerald-500 hover:bg-emerald-600 text-white font-bold rounded-full shadow-lg shadow-emerald-500/30 transition-all hover:-translate-y-1 flex items-center justify-center gap-2">

                                        </a>
                                    </div>
                                </div>

                                <div className="relative order-1 lg:order-2 flex justify-center items-center h-[350px] sm:h-[450px] lg:h-[600px] w-full">
                                    <div className="absolute inset-0 bg-gradient-to-tr from-emerald-100 to-white/10 rounded-full blur-3xl opacity-60"></div>
                                    
                                    <div 
                                        className="relative w-full max-w-[450px] cursor-pointer group z-20 animate-float"
                                        onClick={handleMascotClick}
                                    >
                                        <div className={`absolute -top-8 left-1/2 -translate-x-1/2 bg-white px-6 py-3 rounded-2xl shadow-xl border border-emerald-100 transition-all duration-300 z-30 w-max pointer-events-none ${showBubble ? 'opacity-100 translate-y-0 scale-100' : 'opacity-0 translate-y-4 scale-95'}`}>

                                            <div className="absolute -bottom-2.5 left-1/2 -translate-x-1/2 w-5 h-5 bg-white border-b border-r border-emerald-100 rotate-45"></div>
                                        </div>
                                        
                                        <video 
                                            ref={videoRef}
                                            src="videos/tanjibaby_hi.mp4" 
                                            className="w-full h-auto blend-multiply scale-110 drop-shadow-2xl transition-transform duration-500 group-hover:scale-110"
                                            muted 
                                            playsInline
                                            poster="images/tanjibaby.png"
                                            loop={false}
                                        ></video>
                                        
                                        <div className="absolute -bottom-6 left-1/2 -translate-x-1/2 w-40 h-8 bg-black/5 blur-xl rounded-full"></div>
                                    </div>
                                </div>
                            </div>
                        </section>

                        <section id="solutions" className="py-24 px-6 bg-white relative z-20 rounded-t-[3rem] border-t border-slate-100 shadow-[0_-10px_40px_rgba(0,0,0,0.02)]">
                            <div className="max-w-6xl mx-auto">
                                <div className="text-center mb-16">
                                    <h2 className="text-3xl md:text-4xl font-black text-slate-800 mb-4">碳吉宇宙的多元發展</h2>
                                    <p className="text-slate-500 font-medium max-w-2xl mx-auto">我們提供三大核心領域的永續解決方案，並由專屬的碳吉寶寶為您導覽</p>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                                    {solutions.map((sol, index) => (
                                        <div key={sol.id} className={`bg-gradient-to-b ${sol.color} rounded-3xl p-8 border border-white shadow-sm hover:shadow-xl transition-all duration-300 group flex flex-col items-center text-center cursor-pointer hover:-translate-y-2`}>

                                            <h3 className="text-xl font-bold text-slate-800 mb-3">{sol.title}</h3>
                                            <p className="text-slate-600 text-sm leading-relaxed mb-6 flex-grow">{sol.desc}</p>
                                            
                                            <div className="mt-auto w-full pt-4 border-t border-black/5">
                                                <span className={`inline-flex items-center gap-1 text-sm font-bold opacity-80 group-hover:opacity-100 transition-opacity ${sol.textColor}`}>
                                                    了解更多 <ArrowRight size={16} className="transform group-hover:translate-x-1 transition-transform" />
                                                </span>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </section>
                        
                        <section className="py-20 px-6 bg-slate-800 relative overflow-hidden">
                            <div className="max-w-5xl mx-auto bg-slate-700/50 rounded-3xl p-8 md:p-12 border border-slate-600 flex flex-col md:flex-row items-center gap-8 md:gap-12 backdrop-blur-sm relative z-10">
                                <div className="w-40 h-40 flex-shrink-0 relative">
                                    <img src="images/tanjibaby9.png" alt="Sleeping Baby" className="w-full h-full object-cover rounded-full border-4 border-slate-600 shadow-2xl mix-blend-screen opacity-90" />
                                </div>
                                <div className="text-center md:text-left flex-grow">
                                    <h3 className="text-2xl md:text-3xl font-bold text-white mb-3">準備好啟動永續轉型了嗎？</h3>
                                    <p className="text-slate-300 mb-6 max-w-lg">無論是企業碳排管理、社區韌性建構，還是創新的環境教育專案，碳吉團隊都能為您提供專業的技術支援。</p>
                                    <div className="flex flex-col sm:flex-row items-center justify-center md:justify-start gap-4">
                                        <a href="mailto:tanji2026@gmail.com" className="px-8 py-3 bg-emerald-500 hover:bg-emerald-400 text-slate-900 font-bold rounded-full transition-colors inline-block">
                                            與我們聯繫
                                        </a>
                                        <a href="mailto:tanji2026@gmail.com" className="text-emerald-400 hover:text-emerald-300 font-medium transition-colors">
                                            tanji2026@gmail.com
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </section>
                    </main>

                    <footer className="bg-slate-900 py-8 px-6 text-center border-t border-slate-800">
                        <div className="flex items-center justify-center gap-2 mb-4 text-emerald-500">
                            <Leaf size={20} />
                            <span className="font-bold tracking-widest uppercase text-sm">TanJi Ecosystem</span>
                        </div>
                        <p className="text-slate-500 text-xs">© 2026 TanJi Project. All rights reserved.</p>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
