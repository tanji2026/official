</style></head><body class="admin-page"><div id="admin-app"><main class="container admin-main"><h1>TanJi／碳吉管理後台</h1><p>正在載入管理後台…</p></main></div><dialog id="editor-dialog" class="dialog" aria-label="編輯內容"></dialog><dialog id="confirm-dialog" class="dialog" aria-label="確認操作"></dialog><noscript><p class="container">管理後台需要 JavaScript 與網路連線。</p></noscript><script>window.TANJI_SEED={"settings": {"brand": "TanJi", "nameZh": "碳吉", "introZh": "碳吉，探索永續解方的新創團隊。", "introEn": "TanJi, a startup team exploring sustainability solutions.", "email": "tanji2026@gmail.com", "youtube": "", "previewProjectId": "tj1", "aboutZh": "碳吉以永續創新為方向，透過競賽作品與數位實作，關注氣候、金融與社會之間的連結。我們持續整理實作經驗，也歡迎不同領域的合作提案。", "aboutEn": "TanJi explores sustainability innovation through competition projects and digital work, considering connections between climate, finance and society. We continue to develop our experience and welcome collaboration proposals.", "purpleZh": "紫色融合了熱情與行動的紅色，以及科技與智慧的藍色。對碳吉而言，它代表以科技與跨域思考，探索永續發展的實踐方式。", "purpleEn": "Purple brings together the red of passion and action with the blue of technology and insight. For TanJi, it represents exploring practical approaches to sustainability through technology and interdisciplinary thinking."}, "projects": [{"id": "tj9", "category": "climate", "titleZh": "三鶯永續行：AI 智慧交通公民共創平台", "titleEn": "SanYing Sustainable Mobility: AI Smart Traffic Citizen Co-creation Platform", "descriptionZh": "以三鶯地區交通議題為題，結合 AI 分析與公民參與的網頁平台。", "descriptionEn": "A web platform exploring mobility in the SanYing area through AI analysis and citizen participation.", "detailZh": "臺北聯合大學系統入圍決賽作品。結合 AI 交通數據分析與公民參與機制，為三鶯地區打造專屬的永續交通共創平台，推動地方淨零轉型。", "detailEn": "Finalist of the University System of Taipei competition. Integrates AI traffic analysis and civic participation to build a sustainable mobility co-creation platform.", "url": "https://tanji2026.github.io/sanying/", "image": "", "tagsZh": ["智慧城市", "交通分析", "公民科技", "永續"], "tagsEn": ["Smart City", "AI Traffic", "Civic Tech", "ESG"], "ye y reuse of coffee grounds, leaves and other organic resources through sensing and QR-based collection design.", "detailZh": "新北青年氣候行動徵件入圍作品。結合 MycoNode 微型感測模組（ESP32主控）與 O2O 掃碼打卡，將社區咖啡渣與落葉依黃金碳氮比轉化為有機黑金土，打造零門檻的循環生態系。", "detailEn": "An innovative circular economy initiative matching golden carbon-to-nitrogen ratios. It integrates MycoNode sensors (ESP32) and O2O QR scanning to upcycle local coffee grounds and leaves into organic soil.", "url": "https://tanji2026.github.io/tanji-loop/", "image": "", "tagsZh": ["循環經濟", "微型感測", "掃碼點收", "Firebase"], "tagsEn": ["Circular Economy", "IoT Sensors", "O2O Check-in", "Firebase"], "year": "2026", "order": 3, "featured": false, "visibility": "published", "archived": false}, {"id": "tj5", "category": "learning", "titleZh": "三峽職人：手路尋蹤", "titleEn": "Sanxia Artisan Quest", "descriptionZh": "結合職人性格測驗與三峽在地文化的互動網頁，串聯線上問答與地方體驗。", "descriptionEn": "An interactive web experience connecting artisan personality questions, Sanxia culture and local experiences.", "detailZh": "結合MBTI與在地職人的互動式網頁測驗。透過五感問答為玩家分析專屬職人屬性，並引導至三峽老街的實體工作室進行線下體驗，推動地方創生。", "detailEn": "An interactive web test combining MBTI and local artisans. It analyzes players' artisan attributes through sensory questions and guides them to physical workshops in Sanxia Old Street for offline experiences, promoting regional revitalization.", "url": "https://tanji2026.github.io/sanxia/", "image": "", "tagsZh": ["遊戲化", "地方創生", "文化傳承", "性格測驗"], "tagsEn": ["Gamification", "Local Revitalization", "Cultural Heritage", "MBTI"], "year": "2026", "order": 4, "featured": false, "visibility": "published", "archived": false}, {"id": "tj4", "category": "finance", "titleZh": "碳吉：企業綠色融資暨碳管理平台", "titleEn": "TanJi: Green Financing & Carbon Mgmt Platform", "descriptionZh": "企業綠色融資與碳排管理的概念驗證作品，呈現碳排計算、歷史清冊與資料管理流程。", "descriptionEn": "A proof-of-concept for green finance and carbon management, presenting calculation, inventory records and data workflows.", "detailZh": "專為企業設計的綠色融資與碳排管理儀表板 (PoC 模擬環境)。特色為深度整合 AWS async function saveDraft(content,expectedRevision){const c=C.cleanContent(content);const {f,db,auth}=await requireAdmin();const ref=f.doc(db,'site','draft');return f.runTransaction(db,async tx=>{const s=await tx.get(ref);const rev=s.exists()?(s.data().revision||0):0;if(rev!==expectedRevision)throw Error('資料已在其他視窗更新，請重新載入後再編輯。');const next=rev+1;tx.set(ref,{schemaVersion:1,revision:next,content:c,updatedAt:f.serverTimestamp(),updatedBy:auth.currentUser.email});return next;});}
async function publish(content,expectedDraftRevision,expectedPublicRevision){const c=C.cleanContent(content),pub=C.toPublic(c);const {f,db,auth}=await requireAdmin();const dref=f.doc(db,'site','draft'),pref=f.doc(db,'site','public'),href=f.doc(f.collection(db,'history'));return f.runTransaction(db,async tx=>{const [d,p]=await Promise.all([tx.get(dref),tx.get(pref)]);const dr=d.exists()?(d.data().revision||0):0,pr=p.exists()?(p.data().revision||0):0;if(dr!==expectedDraftRevision||pr!==expectedPublicRevision)throw Error('雲端版本已更新，請重新載入後再發布。');const metadata={schemaVersion:1,updatedAt:f.serverTimestamp(),updatedBy:auth.currentUser.email};tx.set(dref,{...metadata,revision:dr+1,content:c});tx.set(pref,{...metadata,revision:pr+1,content:pub});tx.set(href,{...metadata,revision:pr+1,content:c});return {draftRevision:dr+1,publicRevision:pr+1};});}
async function listHistory(){const {f,db}=await requireAdmin();const q=f.query(f.collection(db,'history'),f.orderBy('updatedAt','desc'),f.limit(15));const snap=await f.getDocs(q);return snap.docs.map(d=>({id:d.id,...d.data()}));}

function changed(msg){state.dirty=true;message(msg||'內容已套用至本機草稿，請儲存草稿或發布。');render();}
document.addEventListener('click',e=>{if(state.busy&&e.target.closest('[data-tab],[data-edit],[data-archive],[data-action]')){e.preventDefault();return;}const tab=e.target.closest('[data-tab]');if(tab){if(!applySettings())return;state.tab=tab.dataset.tab;state.search='';state.visibility='all';render();return;}const close=e.target.closest('[data-close-dialog]');if(close){closeEditor();return;}const edit=e.target.closest('[data-edit]');if(edit){openEditor(edit.dataset.edit);return;}const archive=e.target.closest('[data-archive]');if(archive){const r=cfind(state.tab,archive.dataset.archive);r.archived=!r.archived;changed(r.archived?'已加入封存草稿，可還原；發布後才會自官網移除。':'已還原至草稿，請確認內容狀態後發布。');return;}const history=e.target.closest('[data-restore-version]');if(history){const h=state.history.find(v=>v.id===history.dataset.restoreVersion);dialogConfirm('還原到目前草稿','<p class="admin-help">將以版本 '+h.revision+' 取代目前編輯內容，官網不會立即變更。</p>',()=>{state.content=C.cleanContent(h.content);changed('版本已帶入草稿。確認後請儲存或發布。');});return;}const a=e.target.closest('[data-action]');if(!a)return;const action=a.dataset.action;if(action==='login')run(async()=>{await cloud.login();});if(action==='logout'){const perform=()=>run(async()=>{await cloud.logout();state.content=null;state.dirty=false;message('已登出。');});if(state.dirty||formDirty)dialogConfirm('尚有未儲存內容','<p class="admin-help">登出會放棄尚未儲存的編輯。可以先取消並匯出備份。</p>',perform);else perform();}if(action==='new')openEditor();if(action==='save'){if(!applySettings())return;run(save);}if(action==='confirm-publish'){if(!applySettings())return;try{const pub=C.toPublic(state.content);dialogConfirm('發布官網內容','<div class="publish-summary">將公開：<br><strong>'+pub.projects.length+'</strong> 件作品<br><strong>'+pub.awards.length+'</strong> 筆競賽成果<br><strong>'+pub.news.length+'</strong> 則動態<br><strong>'+pub.topics.length+'</strong> 個關注議題</div><p class="admin-help">草稿與封存項目不會發布。這次內容會保留版本記錄。</p>',()=>run(publish));}catch(err){message(err.message,true);render();}}if(action==='reload'){if(state.dirty)dialogConfirm('重新載入雲端','<p class="admin-help">尚未儲存的編輯將被取代。</p>',()=>run(reload));else run(reload);}if(action==='seed'){const seed=C.clone(window.TANJI_SEED);for(const type of C.TYPES){const ids=new Set(state.content[type].map(r=>r.id));state.content[type].push(...seed[type].filter(r=>!ids.has(r.id)));}for(const [key,v]of Object.entries(seed.settings))if(!state.content.settings[key])state.content.settings[key]=v;changed('初始內容已帶入草稿；沒有覆蓋相同 ID 的現有資料。');}if(action==='history')run(async()=>{state.history=await cloud.listHistory();message(state.history.length?'已讀取最近 '+state.history.length+' 個發布版本。':'目前尚無發布版本。');});if(action==='export'){const blob=new Blob([JSON.stringify({schemaVersion:1,projectId:'tanji-official-1219f',exportedAt:new Date().toISOString(),content:state.content},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='tanji-backup-'+new Date().toISOString().slice(0,10)+'.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),2000);}});
document.addEventListener('submit',e=>{if(e.target.id==='editor-form'){e.preventDefault();try{const form=new FormData(e.target),r={...editor.record};for(const [k,v]of form.entries())r[k]=String(v).trim();r.order=Number(form.get('order'))||0;r.visibility=form.get('visibility');if(editor.type==='projects'){r.featured=form.has('featured');r.tagsZh=String(form.get('tagsZh')||'').split(/[,，\n]/).map(s=>s.trim()).filter(Boolean).slice(0,8);r.tagsEn=String(form.get('tagsEn')||'').split(/[,，\n]/).map(s=>s.trim()).filter(Boolean).slice(0,8);}if(editor.type==='awards')r.winner=form.has('winner');if(r.url&&!C.safeUrl(r.url))throw Error('請使用完整 HTTPS 網址。');if(r.image&&!C.safeUrl(r.image,true))throw Error('圖片請填 HTTPS 網址或 ./images/檔名。');if(editor.id){const i=state.content[editor.type].findIndex(x=>x.id===editor.id);state.content[editor.type][i]=r;}else state.content[editor.type].push(r);closeEditor();changed();}catch(err){document.getElementById('editor-error').textContent=err.message;}}if(e.target.id==='settings-form'){e.preventDefault();formDirty=false;const form=new FormData(e.target);for(const [k,v]of form.entries())state.content.settings[k]=String(v).trim();changed('網站設定已套用至草稿。');}});
let searchTimer;document.addEventListener('input',e=>{if(e.target.closest?.('#settings-form'))formDirty=true;if(e.target.id==='record-search'){const value=e.target.value;clearTimeout(searchTimer);searchTimer=setTimeout(()=>{state.search=value;render();const i=document.getElementById('record-search');i.focus();},250);}});
document.addEventListener('change',async e=>{if(e.target.closest?.('#settings-form'))formDirty=true;if(state.busy)return;if(e.target.id==='visibility-filter'){state.visibility=e.target.value;render();}if(e.target.id==='backup-file'){const file=e.target.files?.[0];if(!file)return;try{if(file.size>800000)throw Error('備份檔案過大。');const raw=JSON.parse(await file.text());if(raw.projectId&&raw.projectId!=='tanji-official-1219f')throw Error('此備份屬於其他 Firebase 專案。');const c=C.validate(raw.content||raw);dialogConfirm('匯入備份','<p class="admin-help">將取代目前草稿；不會立即變更官網。確認後仍需儲存或發布。</p>',()=>{state.content=c;changed('備份已帶入草稿。');});}catch(err){message(err.message,true);render();}}});
window.addEventListener('beforeunload',e=>{if(state.dirty||formDirty){e.preventDefault();e.returnValue='';}});
render();cloud.watchAuth(async user=>{state.ready=true;state.user=user;if(!user){state.content=null;state.dirty=false;message('請使用指定的 Google 帳號登入。');render();return;}if(!cloud.isAdmin(user)){message('這個帳號沒有管理權限。',true);render();return;}try{await reload();}catch(error){message(cloud.errorMessage(error),true);}render();}).then(()=>{state.ready=true;render();}).catch(error=>{state.ready=false;message(cloud.errorMessage(error),true);render();});
})();
</script></body></html>
